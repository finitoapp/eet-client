name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Ordered fastest-first (lint ~0.06s, typecheck ~1.9s, test:coverage ~1.3s) for the
      # quickest possible fail-fast signal, matching README "Vývoj" (`bun run check` = lint →
      # typecheck → test) — before build/check:package, which a later test failure would
      # invalidate anyway.
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:coverage
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage/lcov.info
      - run: bun run build
      - run: bun run check:package

  test-runtimes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [node, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - if: matrix.runtime == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.9.4"
      - run: bun install --frozen-lockfile
      - if: matrix.runtime == 'node'
        run: bun run test:node
      - if: matrix.runtime == 'deno'
        run: bun run test:deno

  # Opt-in integration suites (real EET playground endpoint, caeet/*.p12 signing, Playwright) —
  # see README "Opt-in integrační testy s caeet/*.p12" and CONTRIBUTING.md. Runs on the same
  # triggers as `verify`/`test-runtimes` (plus manual workflow_dispatch), but each category is
  # `continue-on-error` so a flaky/unreachable external playground never blocks a merge — this
  # job only surfaces drift (playground changes, expired legacy openssl providers, Playwright API
  # changes) as a visible, non-blocking check.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: p12
            script: test:integration:p12
          - name: cors
            script: test:integration:cors
          - name: live
            script: test:integration:live
          - name: live-browser
            script: test:integration:live-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - if: matrix.name == 'live-browser'
        run: bunx playwright install --with-deps chromium
      - name: bun run ${{ matrix.script }}
        run: bun run ${{ matrix.script }}
        continue-on-error: true
