name: Release

# Triggered by publishing a GitHub Release whose tag is `vX.Y.Z`. Create the release from the
# commit that bumped `package.json`'s `version` to the matching `X.Y.Z` — the tag/version match
# is verified below before anything is published.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for `npm publish` to attach a Sigstore provenance attestation, per
      # `publishConfig.provenance` in package.json (bugs.md #5).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Verify release tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi
      - run: bun run check
      # Runs the build via the `precheck:package` hook, then lints the packed output with publint.
      - run: bun run check:package
      # Auth is via npm trusted publishing (OIDC) using the `id-token: write` permission above —
      # no NPM_TOKEN/NODE_AUTH_TOKEN needed, npm exchanges the GitHub Actions OIDC token for a
      # short-lived publish token as long as this exact workflow file/repo/ref is registered as
      # the package's trusted publisher on npmjs.com.
      - run: npm publish
